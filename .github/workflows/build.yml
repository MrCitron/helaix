name: Build

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform:
          - os: windows-latest
            name: windows
            target: helaix.exe
            additional_params: ""
          - os: macos-latest
            name: darwin
            target: HelAIx.app.zip
            additional_params: "-platform darwin/universal"
    
    runs-on: ${{ matrix.platform.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.0'
          cache-dependency-path: app/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Install Wails
        working-directory: app
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build application
        working-directory: app
        run: wails build ${{ matrix.platform.additional_params }}

      - name: Zip macOS .app bundle
        working-directory: app
        if: matrix.platform.name == 'darwin'
        run: |
          cd build/bin
          zip -r HelAIx.app.zip HelAIx.app

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: helaix-${{ matrix.platform.name }}
          path: app/build/bin/${{ matrix.platform.target }}
